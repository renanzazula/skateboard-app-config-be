server:
  port: 8083

spring:
  application:
    name: app-config

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/skateboard}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    # Flyway owns the schema (db/migration); Hibernate only validates its matches.
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: skateboard-app-config

  flyway:
    enabled: true
    schemas: skateboard-app-config
    create-schemas: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer — same realm as the rest of the platform.
          issuer-uri: ${APP_SECURITY_OAUTH2_ISSUER_URI:http://localhost:8180/realms/skateboard-podcast}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  security:
    oauth2:
      # Tokens must include this in their "aud" claim (see the FE client's
      # "audience" protocol mapper in .docker/keycloak/realm-export.json).
      audience: ${APP_SECURITY_OAUTH2_AUDIENCE:skateboard-app-config-be}
  campaign:
    events:
      # POST /api/campaigns/{id}/events is anonymous and unauthenticated;
      # CampaignEventRateLimitFilter sheds bursts past this per-client window
      # (silently — the client still gets 204). ~40/10s comfortably covers one
      # user's real campaign session.
      rate-limit:
        max-requests: ${APP_CAMPAIGN_EVENTS_RATE_LIMIT_MAX:40}
        window-seconds: ${APP_CAMPAIGN_EVENTS_RATE_LIMIT_WINDOW_SECONDS:10}
      # CampaignEventRetentionJob deletes rows older than this, daily.
      retention-days: ${APP_CAMPAIGN_EVENTS_RETENTION_DAYS:90}
      retention-cron: ${APP_CAMPAIGN_EVENTS_RETENTION_CRON:0 30 3 * * *}

# S3-compatible object storage for branding uploads (login background, app
# logo, branding assets). Locally this points at the MinIO container from
# skateboard-infrastructure/.docker/docker-compose.yaml; in production it
# points at the Railway-managed bucket via the AWS_* env vars below.
railway:
  bucket:
    bucket-name: ${AWS_S3_BUCKET_NAME:skateboard-branding}
    endpoint: ${AWS_ENDPOINT_URL:http://localhost:9000}
    access-key-id: ${AWS_ACCESS_KEY_ID:minioadmin}
    secret-access-key: ${AWS_SECRET_ACCESS_KEY:minioadmin}
    region: ${AWS_DEFAULT_REGION:auto}
    presigned-url-expiration-minutes: 60

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{correlationId}] [%thread] %logger{36} - %msg%n"
